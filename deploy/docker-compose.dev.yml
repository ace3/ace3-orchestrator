name: mini-paperclip-compose-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.compose.dev
    environment:
      POSTGRES_USER: mp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mini_paperclip
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - mp_compose_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mp -d mini_paperclip"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    env_file: .env.compose.dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      MP_DB_DSN: postgres://mp:${POSTGRES_PASSWORD}@db:5432/mini_paperclip?sslmode=disable
      MP_PORT: "8081"
      MP_HOST_CODE_DIR: ${HOST_CODE_DIR}
      MP_CONTAINER_CODE_DIR: /workspace
      MP_SKILLS_CACHE_DIR: /var/lib/mini-paperclip/skills-cache
      MP_WORKTREES_DIR: /var/lib/mini-paperclip/worktrees
      MP_BACKUP_DIR: /var/lib/mini-paperclip/backups
    ports:
      - "${BACKEND_PUBLIC_PORT:-18081}:8081"
    volumes:
      - ../backend:/app:rw
      - ..:/workspace:rw
      - backend_go_pkg:/go/pkg/mod
      - backend_go_build:/root/.cache/go-build
      - mp_compose_dev_skills_cache:/var/lib/mini-paperclip/skills-cache
      - mp_compose_dev_worktrees:/var/lib/mini-paperclip/worktrees
      - mp_compose_dev_backups:/var/lib/mini-paperclip/backups
    command: ["air", "-c", ".air.toml"]

  frontend:
    image: node:20-alpine
    working_dir: /app
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: http://backend:8081
    ports:
      - "${FRONTEND_PUBLIC_PORT:-5173}:5173"
    volumes:
      - ../frontend:/app:rw
      - frontend_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]

volumes:
  mp_compose_dev_pgdata:
  mp_compose_dev_skills_cache:
  mp_compose_dev_worktrees:
  mp_compose_dev_backups:
  backend_go_pkg:
  backend_go_build:
  frontend_node_modules:
