name: mini-paperclip-local

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.local
    environment:
      POSTGRES_USER: mp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mini_paperclip
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mp_local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mp -d mini_paperclip"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mp_local_pgdata:
